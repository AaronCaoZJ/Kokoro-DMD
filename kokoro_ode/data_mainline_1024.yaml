# Data mix for ODE-rollout distillation: the 1024-px tier of the Z-Image packs (used instead of cfg_distill.yaml).
#
# Source: the 1024-px tier of the base model's multi-resolution training mix, i.e. the groups
#   ZImageT2I_1024 / ZImageI2I_story / ZImageI2I_diff (i2i data only exists at 1024). The 256/512/768 tiers are not used.
# DMD only needs the prompt (+ the i2i reference image). The target latent only fixes the output resolution and provides
# arm A's "real image + noise" input; the ODE rollouts that start from pure noise (arms B/C/D) never look at target content.
#
# Reader (fastgen/datasets/kokoro_mainline_pack): a vendored copy of the base model's pack reader (iter_pack_shard grouping,
# held-out blocklist, zimage_caption prompts, I2I_TOKEN_MODE mode tokens) that yields what the FastGen inference branch expects:
# {task_type, text, vae_latent[16,h,w], source_image(PIL)}.

pack_root: ${oc.env:PACK_ROOT,''}

# Prompt rules: the Z-Image caption rules of base-model training (zimage_caption.py + the kokoro2_caption package, see KOKORO2_CAPTION_DIR)
caption_rules: zimage
caption_seed: 0

# The 15 held-out cases (target images + i2i reference images) are excluded from distillation data; evaluation uses the same 15
heldout_blocklist: ${oc.env:HELDOUT_DIR,''}/blocklist.txt

# Each step, rank 0 draws t2i vs i2i once and every rank runs the same task (MixedTaskLoader; keeps sequence shapes in sync across FSDP ranks).
#   The 1024 tier has t2i : i2i = 10 : 13 by sample count → 0.565 (the cfg_distill.yaml default is 0.6).
#   Note an i2i sample is ~11k tokens (reference VAE + ViT + text + target) vs ~4.3k for t2i, so i2i dominates compute.
i2i_prob: 0.565

# Prefix i2i prompts with <|story_mode|> / <|diff_mode|> (chosen per source id, as in I2I_TOKEN_MODE: ehentai-diff/kemono-diff use story).
#   Base-model training and the current inferencer (mode='auto') both use the tokens, but the teacher's CFG distillation used i2i prompts
#   without them (prompt_builders_i2i has no mode token). true = match inference; false = match the teacher's CFG distillation.
i2i_mode_token: true

# Resolution: packed images are already area ≤ 1024², sides divisible by 16, aspect ratio preserved; no extra cropping. Same for reference images (lossless webp).
# Reference images use the inference VAE / ViT transforms (KokoroNetwork._ensure_image_transforms), not the training-time vit_image_transform_args.

t2i:
  # Directories within a group are mixed globally in proportion to their sample counts. ~12.83M samples in total.
  - name: ZImageT2I_1024
    weight: 1.0
    dirs:
      - full_pretrain1024_danv3/danbooru_with_nl
      - full_pretrain1024/danbooru_with_nl        # all 1.81M images are also in danv3; both are listed (as in base training), so anime is over-weighted
      - full_pretrain1024/yande_with_nl
      - full_pretrain1024/pornpics
      - full_pretrain1024/pornpics2_from512清单
      - full_pretrain1024/pornpics_pornstars_old_caption

i2i:
  # story : diff weights follow their sample counts, 5.85M : 0.59M (= 11.815 : 1.185)
  - name: ZImageI2I_story
    weight: 11.815
    dirs:
      - i2i_full_pack_1024/1douyin
      - i2i_full_pack_1024/1douyin-carousell
      - i2i_full_pack_1024/1gangbang
      - i2i_full_pack_1024/1ins
      - i2i_full_pack_1024/1pornstarAB
      - i2i_full_pack_1024/1pornstars
      - i2i_full_pack_1024/2douyin-photographers
      - i2i_full_pack_1024/2ehentai
      - i2i_full_pack_1024/4fuck
      - i2i_full_pack_1024/5fvck
      - i2i_full_pack_1024/animate-cut
      - i2i_full_pack_1024/av
      - i2i_full_pack_1024/coser
      - i2i_full_pack_1024/douyin
      - i2i_full_pack_1024/ins
      - i2i_full_pack_1024/model
      - i2i_full_pack_1024/pornpics
      - i2i_full_pack_1024/xhs
      - i2i_full_pack_1024/xiuren
      - i2i_full_pack_1024/youtube
      - i2i_full_pack_1024_b/2ehentai
      - i2i_full_pack_1024_b/animate-cut
      - i2i_full_pack_1024_b/douyin
      - i2i_full_pack_1024_b/ins
      - i2i_full_pack_1024_b/pornpics
      - i2i_full_pack_1024_b/xhs
      - i2i_singleref_ffmgal_0924/ffm_sr
      - i2i_singleref_ffmgal_0924/gal2_sr
      - i2i_singleref_ffmgal_0924/galgame_sr
  - name: ZImageI2I_diff
    weight: 1.185
    dirs:
      - i2i_full_pack_1024/banana-cos
      - i2i_full_pack_1024/banana-figure
      - i2i_full_pack_1024/banana-fwd
      - i2i_full_pack_1024/banana-socks-rev
      - i2i_full_pack_1024/danbooru-diff
      - i2i_full_pack_1024/ehentai-diff
      - i2i_full_pack_1024/kemono-diff
      - i2i_full_pack_1024/scale_edit
      - i2i_full_pack_1024_b/banana-cos
      - i2i_full_pack_1024_b/banana-figure
      - i2i_full_pack_1024_b/banana-fwd
      - i2i_full_pack_1024_b/banana-socks-rev
      - i2i_full_pack_1024_b/danbooru-diff
      - i2i_full_pack_1024_b/ehentai-diff
      - i2i_full_pack_1024_b/kemono-diff
      - i2i_full_pack_1024_b/scale_edit

# Resolution cap (patch-grid side length, 16 px per cell): equals the network's MAX_LATENT_SIZE 128 (2048 px).
#   With a cap of 96 (1536 px), only extreme images with aspect ratio > 2.25 would exceed it, since the 1024 packs have area ≤ 1024².
#   The teacher was trained with max_latent_size 128, so 128 is used here.
max_latent_size: 128

# Reader processes: 2 workers per GPU, shuffle buffer 16. The WebDataset loader (cfg_distill.yaml) buffers decoded multi-frame PIL
#   samples (~200 MB each) and can exhaust host memory with more workers; here t2i reads only latents (a few hundred KB) and i2i adds one reference image.
num_workers: 2
shuffle_buffer: 16

# Shards each worker keeps open at once, picking one at random per sample (1 = sequential: read one shard at a time).
#   A DMD run lasts only a few thousand iterations; reading sequentially, each worker would see just 1–3 shards per run (~900 i2i samples per shard),
#   so sources arrive in blocks. More open shards keep the long-run mix unchanged (each slot is a sequential reader) and only shuffle sources
#   in the short run. See fastgen/datasets/kokoro_mainline_pack/loader.py.
open_shards: 8
# Read-order seed (mixed into the shard order / slot / buffer / group-sampling RNG streams; the cross-rank split always uses seed 42).
#   Overridden by env DATA_SEED. FastGen does not save reader progress, so a restart with the same seed rereads the same shards; change it on restart.
seed: 42
